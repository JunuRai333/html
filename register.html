<!DOCTYPE html>
<head>
    <title>Register | HTML Project</title>  

    <!-- favicon  -->
    <link rel="shortcut icon" href="./images/banner1.webp" type="image/x-icon">  
    <!-- CDN for icons content, delivery, network  -> icons lai access garna -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    <h2>Register for Free!</h2> 
    <form action="">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="FNAME">Full Name:</label>
            <input type="text" id="FNAME" placeholder="IN BLOCK LETTER">
            <br><br>
            <label for="Email">Email:</label>
            <input type="text" id="Email" placeholder="IN SMALL LETTER">
            <br><br>
            <label for="Address">Address:</label>
            <input type="text" id="Address" placeholder="IN BLOCK LETTER">
            <br><br>
            <label for="Contact">Contact:</label>
            <input type="text"  id="Contact" placeholder="Your Contact Num">
            <br><br>
            <label for="Gender">Gender</label>
            <input type="radio"  name="Gender" value="Male">Male
            <input type="radio" name="Gender" value="Female" >Female
            <br><br>
            <label for="Citizenship">Citizenship:</label>
            <input type="file" id="Citizenship" placeholder="">
            <br><br>
            <label for="DOB">DOB:</label>
            <input type="date" id="DOB" placeholder="DOB">
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="Password" placeholder="Enter Your Password">
            <br><br>
            <label for="Submit"></label>
            <input type="submit" id="Submit" placeholder="">
        </fieldset>

    </form>  
</body>
</html>
